<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>WebView 能力探测 · 本库依赖清单</title>
<!--
  ============================================================================
  这页是干什么的（W10 / W12）
  ----------------------------------------------------------------------------
  `docs/LAYER-BASELINE.md` 里那张表**需要有人拿真机填**。填之前必须先有
  "到底要测什么"的清单 —— 这页就是那份清单的执行体。

  🔴 关键设计：**清单不是拍脑袋列的，是从本库源码里 grep 出来的。**
     每一条都写着"库里有几个文件在用"。没用到的能力不测 ——
     测了也只是给人一堆看不懂的红叉。

  🔴 第二个设计：**每一项都标注判定方式**。
     `CSS.supports()` 是**声明式**探测（问浏览器"你支持吗"），
     而 `gap` 在 flex、`@layer` 是否真被解析、`popover` 是否真能打开，
     只有**实测行为**才算数 —— 声明支持但行为不对，是 WebView 上的常态。
     两类混在一张表里而不标注，读的人会以为它们是同一种证据。
  ============================================================================
-->
<style>
  /* 刻意不引本库任何 CSS：本页要在"库还没被兼容的浏览器"里也能看 */
  :root {
    --bg: #ffffff; --fg: #15181c; --muted: #5a6068; --line: #d8dce1;
    --ok: #1a7f3c; --bad: #b3261e; --warn: #8a5a00; --card: #f6f7f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --fg: #e4e7ea; --muted: #a9b1ba; --line: #2e343c;
      --ok: #6faa7a; --bad: #e07a6e; --warn: #c99a3f; --card: #1c2024;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 40px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.lead { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .env {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; word-break: break-all;
    margin-bottom: 14px;
  }
  .env b { color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.r { white-space: nowrap; font-weight: 600; }
  .y { color: var(--ok); }
  .n { color: var(--bad); }
  .m { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .use { color: var(--muted); font-size: 12px; }
  .sum { margin: 16px 0 10px; font-size: 15px; }
  button {
    display: block; width: 100%; min-height: 48px; margin: 12px 0 0;
    font: inherit; font-weight: 600; color: var(--bg); background: var(--fg);
    border: 0; border-radius: 8px; padding: 12px;
  }
  button.secondary { color: var(--fg); background: transparent;
    border: 1px solid var(--line); }
  button[disabled] { opacity: .55; }
  .status { min-height: 1.4em; margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  pre {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; overflow: auto; font-size: 11px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-all;
    /* 兜底路径要能选中：iOS 上必须显式声明，否则长按只能选中一个词 */
    -webkit-user-select: text; user-select: text;
  }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<h1>WebView 能力探测</h1>
<p class="lead">
  清单来自本库源码的实际用法（括号里是“有几个文件在用”）。
  把结果贴进 <code>docs/LAYER-BASELINE.md</code> 的对应机型行。
</p>

<div class="env" id="env"></div>

<table>
  <thead>
    <tr><th>能力</th><th>结果</th><th>库里的用法</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<div class="sum" id="sum"></div>

<!-- 🔴 为什么第一个按钮是"发送"而不是"复制"
     `navigator.clipboard` 只在**安全上下文**里存在：https、localhost、file://。
     用手机访问 `http://192.168.x.x:8099` **不是**安全上下文 ⇒ 那个 API 根本不存在，
     只能退回 document.execCommand（老接口），再不行就真的复制不了。
     ⇒ 主路径改成同源 POST，把结果送回跑服务的电脑；剪贴板降为备用。 -->
<button id="send" type="button">① 发送到电脑（推荐）</button>
<button id="copy" type="button" class="secondary">② 复制结果（JSON）</button>
<div class="status" id="status" role="status" aria-live="polite"></div>
<pre id="out">…</pre>
<p class="hint">
  ⚠️ 「声明」= <code>CSS.supports()</code> 的回答；「实测」= 真的建了元素量出来的。
  WebView 上「声明支持但行为不对」很常见，两者不能混着读。
</p>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- 探测工具
  function supports(prop, val) {
    try { return CSS.supports(prop, val); } catch (e) { return false; }
  }
  function selectorSupports(sel) {
    try {
      return CSS.supports('selector(' + sel + ')') ||
             CSS.supports('selector(:is(' + sel + '))');
    } catch (e) { return false; }
  }

  /* flex + gap 只能实测：老 WebKit 的 CSS.supports('gap','1px') 对 grid 为真、
     对 flex 为假，而 supports 分不出用在哪个上下文。⇒ 真建两个盒子量距离。 */
  function flexGapWorks() {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:-9999px;top:0;display:flex;' +
      'gap:20px;width:auto;';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:10px;';
    box.appendChild(a); box.appendChild(b);
    document.body.appendChild(box);
    var d = b.getBoundingClientRect().left - a.getBoundingClientRect().right;
    document.body.removeChild(box);
    return d >= 19;   // 允许 1px 的亚像素误差
  }

  /* @layer 只能实测：`CSS.supports('at-rule','@layer')` 在多数引擎里不支持这种问法。
     做法：塞一张带 @layer 的样式表，看 CSSOM 里**还剩几条规则** ——
     解析器认它才会留下规则。 */
  function layerWorks() {
    var s = document.createElement('style');
    s.textContent = '@layer fl-probe { .fl-probe-x { color: rgb(1, 2, 3); } }' +
      '.fl-probe-y { color: rgb(4, 5, 6); }';
    document.head.appendChild(s);
    var n = 0;
    try { n = s.sheet ? s.sheet.cssRules.length : 0; } catch (e) { n = 0; }
    var got = 0;
    try {
      var el = document.createElement('div');
      el.className = 'fl-probe-x';
      document.body.appendChild(el);
      got = getComputedStyle(el).color;
      document.body.removeChild(el);
    } catch (e) { got = ''; }
    document.head.removeChild(s);
    // 两条规则都留下 + 层内规则真的应用了颜色，才算支持
    return n === 2 && got.replace(/\s/g, '') === 'rgb(1,2,3)';
  }

  /* popover 属性：有属性还不够，得真的能打开 */
  function popoverWorks() {
    if (!('popover' in HTMLElement.prototype)) return false;
    try {
      var el = document.createElement('div');
      el.setAttribute('popover', 'manual');
      el.textContent = 'x';
      document.body.appendChild(el);
      el.showPopover();
      var shown = el.matches(':popover-open');
      el.hidePopover();
      document.body.removeChild(el);
      return shown;
    } catch (e) { return false; }
  }

  /* accent-color 声明支持 + 真的影响渲染（复选框） */
  function accentColorWorks() {
    if (!supports('accent-color', 'rgb(1, 2, 3)')) return false;
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.style.accentColor = 'rgb(1, 2, 3)';
    document.body.appendChild(cb);
    var v = getComputedStyle(cb).accentColor;
    document.body.removeChild(cb);
    return /rgb\(1,\s*2,\s*3\)/.test(v);
  }

  // ---------------------------------------------------------------- 清单
  // 每一条：能力名 / 判定函数 / 判定方式 / 库里的用法
  var ITEMS = [
    ['自定义属性（CSS 变量）', function () { return supports('--x', '0'); }, '声明',
      '全部令牌（01-tokens）'],
    [':focus-visible', function () { return selectorSupports(':focus-visible'); }, '声明',
      '36 个文件（焦点环）'],
    [':is() / :where()', function () { return selectorSupports(':is(a, b)'); }, '声明',
      '2 个文件（选择器简化）'],
    [':has()', function () { return selectorSupports(':has(a)'); }, '声明',
      '8 个文件（父子联动态）'],
    ['clamp()', function () { return supports('width', 'clamp(1px, 2vw, 3px)'); }, '声明',
      '7 个文件（流式字号/间距）'],
    ['flex + gap', flexGapWorks, '实测',
      '56 个文件（组件间距）'],
    ['aspect-ratio', function () { return supports('aspect-ratio', '1'); }, '声明',
      '1 个文件（媒体容器）'],
    ['dvh 单位', function () { return supports('height', '100dvh'); }, '声明',
      '1 个文件（全屏面板）'],
    ['scrollbar-width', function () { return supports('scrollbar-width', 'thin'); }, '声明',
      '6 个文件（滚动条令牌）'],
    ['accent-color', accentColorWorks, '实测',
      '2 个文件（原生控件着色）'],
    ['color-scheme', function () { return supports('color-scheme', 'dark'); }, '声明',
      '15 个文件（暗色）'],
    ['backdrop-filter', function () {
      return supports('backdrop-filter', 'blur(1px)') ||
             supports('-webkit-backdrop-filter', 'blur(1px)');
    }, '声明', '3 个文件（毛玻璃浮层）'],
    ['<dialog> + ::backdrop', function () {
      return typeof HTMLDialogElement === 'function' &&
             selectorSupports('::backdrop');
    }, '声明', '2 个文件（模态）'],
    ['Popover API', popoverWorks, '实测',
      '9 个文件（气泡/下拉）'],
    ['@layer（尚未使用，切层的前提）', layerWorks, '实测',
      '0 个文件 —— 见 docs/LAYER-BASELINE.md']
  ];

  // ---------------------------------------------------------------- 渲染
  var ua = navigator.userAgent;
  var vp = window.innerWidth + '×' + window.innerHeight +
    ' @' + (window.devicePixelRatio || 1) + 'x';
  document.getElementById('env').innerHTML =
    '<b>UA</b><br>' + esc(ua) + '<br><b>视口</b> ' + vp +
    '<br><b>prefers-color-scheme: dark</b> ' +
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
      ? '当前为暗' : '当前为亮');

  var results = {};
  var rows = document.getElementById('rows');
  ITEMS.forEach(function (it) {
    var name = it[0], fn = it[1], how = it[2], use = it[3];
    var ok;
    try { ok = !!fn(); } catch (e) { ok = false; }
    results[name] = { ok: ok, method: how };
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + esc(name) +
      '</td><td class="r ' + (ok ? 'y' : 'n') + '">' + (ok ? '✅ 支持' : '❌ 不支持') +
      '<span class="m">' + esc(how) + '</span></td>' +
      '<td class="use">' + esc(use) + '</td>';
    rows.appendChild(tr);
  });

  var yes = Object.keys(results).filter(function (k) { return results[k].ok; }).length;
  var total = Object.keys(results).length;
  var missing = Object.keys(results).filter(function (k) { return !results[k].ok; });

  document.getElementById('sum').textContent = missing.length
    ? '支持 ' + yes + ' / ' + total + ' —— 缺：' + missing.join('、')
    : '支持 ' + yes + ' / ' + total + ' —— 全部支持，可以谈切 @layer';

  var payload = {
    ua: ua,
    viewport: vp,
    prefersDark: !!(window.matchMedia &&
      matchMedia('(prefers-color-scheme: dark)').matches),
    scannedAt: new Date().toISOString(),
    supported: yes,
    total: total,
    missing: missing,
    items: results
  };
  var TXT = JSON.stringify(payload, null, 2);
  document.getElementById('out').textContent = TXT;

  var STATUS = document.getElementById('status');
  function setStatus(msg, kind) {
    STATUS.textContent = msg;
    STATUS.className = 'status' + (kind ? ' ' + kind : '');
  }

  /* ---------------------------------------------------------------- 主路径
   * 同源 POST：把结果直接送回跑服务的电脑。
   * 不需要剪贴板、不需要安全上下文、不需要用户切 App 粘贴。
   * ⚠️ 服务不支持 POST（比如直接用 `python -m http.server`）或页面是 file:// 打开时
   *    会失败 —— 失败必须给出**可操作**的下一步，不能只说"失败了"。
   */
  document.getElementById('send').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    setStatus('正在发送…');
    fetch('/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: TXT
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function () {
      btn.textContent = '✓ 已发送';
      setStatus('✓ 电脑已收到，回聊天里说一声即可', 'ok');
    }).catch(function (e) {
      // 第二选择：sendBeacon。
      // 部分内置 WebView（尤其带内核代理的）对 fetch 有额外限制，
      // 但 sendBeacon 走的是另一条投递路径，常常仍然通。
      // ⚠️ 它返回 true 只代表"已交给浏览器"，不代表服务器收到了 ——
      //    所以文案必须留余地，不能写成"已收到"。
      var queued = false;
      try {
        if (navigator.sendBeacon) {
          queued = navigator.sendBeacon('/report',
            new Blob([TXT], { type: 'application/json' }));
        }
      } catch (e2) { queued = false; }

      if (queued) {
        btn.textContent = '✓ 已通过兼容通道发出';
        setStatus('已通过兼容通道发出。如果我这边没反应，' +
          '说明这个内核把两条路都拦了 —— 请用下面的「② 复制结果」。', 'ok');
        return;
      }
      btn.disabled = false;
      setStatus('发送失败（' + (e && e.message ? e.message : e) +
        '）—— 多半是页面用 file:// 打开，或这个 WebView 把请求拦了。' +
        '请改用下面的「② 复制结果」。', 'bad');
    });
  });

  /* ---------------------------------------------------------------- 备用路径
   * 三级兜底，每一级都要真的能用（这是被实测打回来过一次的地方）：
   *   ① navigator.clipboard  —— 只在 https / localhost / file:// 存在
   *   ② document.execCommand —— 老接口，非安全上下文下仍然可用
   *   ③ 全选可见文本         —— 前两级都不行时，**替他把文本选中**，
   *                             而不是丢一句"请手动长按"（长按只会选中一个词）
   */
  function copyText(text, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        cb(true, 'clipboard');
      }, function () { legacy(); });
      return;
    }
    legacy();

    function legacy() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;' +
          'opacity:0;padding:0;border:0;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);   // iOS 上必须显式给范围
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { cb(true, 'execCommand'); return; }
      } catch (e) { /* 落到第三级 */ }
      selectAllOutput();
      cb(false, 'manual');
    }
  }

  function selectAllOutput() {
    try {
      var pre = document.getElementById('out');
      var range = document.createRange();
      range.selectNodeContents(pre);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      if (pre.scrollIntoView) pre.scrollIntoView({ block: 'center' });
    } catch (e) { /* 选不上就只剩人工操作，下面提示里会说清楚 */ }
  }

  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    copyText(TXT, function (ok, how) {
      if (ok) {
        btn.textContent = how === 'clipboard' ? '已复制 ✓' : '已复制 ✓（兼容模式）';
        setStatus('已复制，可以直接粘贴到聊天里', 'ok');
        setTimeout(function () { btn.textContent = '② 复制结果（JSON）'; }, 2200);
      } else {
        // 🔴 关键：失败时**已经帮你全选了**，写清楚"已选中"
        btn.textContent = '已全选，长按复制';
        setStatus('这个浏览器不允许脚本写剪贴板。已经帮你把结果**全部选中**了 —— ' +
          '在下面的灰框里长按，选「拷贝/复制」即可。', 'bad');
        setTimeout(function () { btn.textContent = '② 复制结果（JSON）'; }, 4000);
      }
    });
  });

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
})();
</script>
</body>
</html>
