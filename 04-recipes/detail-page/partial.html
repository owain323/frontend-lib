<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>detail-page · 部分缺失</title>
<link rel="stylesheet" href="../../01-tokens/tokens.css">
<link rel="stylesheet" href="../../01-tokens/typography.css">
<link rel="stylesheet" href="../../01-tokens/page.css">
<link rel="stylesheet" href="detail-page.css">
</head>
<body class="page">
<main class="wrap">
<p class="dp-demo">detail-page · 部分缺失</p>
<p class="lede">部分字段缺失时，结构不变：缺的那一项仍然占位，只是值写成"未披露"，不是 0。</p>

<section class="detail-page" data-state="partial">
  <div class="detail-hero">
    <div class="detail-hero__deco" aria-hidden="true"></div>
    <div class="detail-hero__body">
      <p class="detail-hero__eyebrow">服务 · SVC-1031</p>
      <h1 class="detail-hero__title">示例对象 B</h1>
      <p class="detail-hero__meta"><span>分类：基础服务</span><span>状态：运行中</span></p>
    </div>
  </div>

  <div class="detail-kpis">
    <div class="detail-kpi">
      <span class="detail-kpi__label">月度调用量</span>
      <span class="num detail-kpi__value">316 万</span>
      <span class="num detail-kpi__delta">较上月 +2.1%</span>
    </div>
    <div class="detail-kpi">
      <span class="detail-kpi__label">平均响应</span>
      <span class="num detail-kpi__value detail-kpi__value--missing">未披露</span>
      <span class="num detail-kpi__delta">数据源未提供</span>
    </div>
    <div class="detail-kpi">
      <span class="detail-kpi__label">可用率</span>
      <span class="num detail-kpi__value">99.72%</span>
      <span class="num detail-kpi__delta">近 30 天</span>
    </div>
  </div>

  <div class="detail-null">
    <p class="detail-null__title">数据完整度：2 / 3</p>
    <p class="detail-null__reason">平均响应缺一项：上游未提供该项，不是零。</p>
  </div>

  <article class="detail-body">
    <section class="detail-body__section">
      <h2 class="detail-body__heading">缺失时怎么排</h2>
      <p class="detail-body__text">缺值写"未披露"并用弱化色，读者一眼能分清"没有数据"和"数据是零"。整块隐藏会让版面塌陷，也会让人误以为没这项。</p>
    </section>
  </article>
</section>
</main>
</body>
</html>
