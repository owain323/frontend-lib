<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>探针用的空白页</title>
<!--
  🔴 为什么需要这个文件（0.8.9）
  --------------------------------------------------------------------------
  `dist-js-parity-gate.js` 需要在"干净白纸"上分别加载源码 JS 与 dist JS，
  比对两者的可观测行为。

  第一版我用 `about:blank` 当白纸 —— **那是错的**：
  `about:blank` 的 origin 是 `about:`，从它加载 `http://127.0.0.1:8000/...`
  会被当作**跨域**而失败（实测：两边都报 `resource-error`）。
  ⇒ 于是"两边报错一致"⇒ 判据判**通过** ⇒ **假绿**（18 个样本全过，其实一个都没加载）。

  ⇒ 正确做法：用一个**同源**的空白页。这个文件就是它。
     它没有 <script>、没有样式依赖，DOM 只有一个空 body，
     加载脚本前后的 window 差异完全来自被加载的那个脚本。
-->
</head>
<body></body>
</html>
