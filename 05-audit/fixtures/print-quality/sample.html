<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>满配样张 · 表格 + 图表 + 位图</title>
<link rel="stylesheet" href="../../../01-tokens/tokens.css">
<link rel="stylesheet" href="../../../04-recipes/report/report.css">
<link rel="stylesheet" href="../../../04-recipes/table/table.css">
<link rel="stylesheet" href="../../../09-assets/scientific-plot/scientific-plot.css">
<link rel="stylesheet" href="../../../09-assets/sparkline/sparkline.css">
<style>
  .page { padding: 14mm 15mm; }


  h1 { font-size: 15pt; margin: 0 0 2mm; }
  .lead { font-size: 10pt; color: var(--text-secondary); margin: 0 0 6mm; line-height: 1.6; }
  /* ⚠️ 这里**不定义图框和图注** —— 它们必须来自 04-recipes/report/report.css。
     夹具一旦自造 `.figure` / `.figure__cap`，"纸上看到的就是库的输出"这句话
     就不成立了：2026-11-06 打样时图框用了自造的 #b6bcc4 + 0.5pt，
     纸面覆盖率 52%，几乎不可见，而库里的规则根本没参与。 */
  .splot { width: 100%; height: auto; display: block; }
  .shots { display: flex; gap: 6mm; align-items: flex-start; }
  /* 两张**同宽**：纸面上的差别只能来自素材分辨率，不能来自尺寸 ——
     否则"为什么这张更清楚"会有两个变量，说不清。 */
  .shots .rep__fig { margin: 0; flex: 0 0 76mm; }
  .shots img { width: 100%; height: auto; display: block; }
  .spark-row { display: flex; gap: 8mm; margin: 0 0 6mm; }
  .spark-item { flex: 1 1 0; }
  .spark-item b { display: block; font-size: 9pt; }
  .spark-item em { display: block; font-size: 12pt; font-style: normal; font-variant-numeric: tabular-nums; }
  .spark-wrap { display: block; margin-top: 1mm; }
  .sparkline { display: block; width: 100%; }
  /* 页面级排版决定，不是绕过库：库的块距（--sp-5）在 A4 上偏大，
     三块内容 + 一张表必然溢出到第 2 页（实测 p1 余 65mm，表格要 63mm），
     留下大半张空白。样张只有一页时，读的人才对得上"同一张纸上的比较"。 */
  @media print {
    .rep__fig { margin: 3mm 0; }
    .rep h1 { margin-bottom: 1.5mm; }
    .lead { margin-bottom: 3mm; }
    .spark-row { margin-bottom: 3mm; }
  }
</style>
</head>
<body>
<main class="page rep">
  <h1>满配样张：表格 · 矢量图 · 位图</h1>
  <p class="lead">
    四类"上纸会变样"的东西同页：三线表、矢量折线、迷你趋势图、两张位图。
    位图分两类，纸上的分辨率要求不同 —— 连续调 300 dpi 够，线条艺术要 600 dpi。
  </p>

  <figure class="rep__fig">
    <svg class="splot" viewBox="0 0 680 240" role="img" aria-label="阻尼振荡位移随时间变化">
      <g class="splot__grid">
        <line x1="60" y1="40"  x2="650" y2="40"/>
        <line x1="60" y1="90"  x2="650" y2="90"/>
        <line x1="60" y1="140" x2="650" y2="140"/>
        <line x1="60" y1="190" x2="650" y2="190"/>
      </g>
      <line class="splot__axis" x1="60" y1="20" x2="60" y2="200"/>
      <line class="splot__axis" x1="60" y1="200" x2="650" y2="200"/>
      <g class="splot__s0">
        <path class="splot__band" d="M60 120 L60 120 C120 60 180 60 240 120 C300 180 360 180 420 120 C480 60 540 60 600 120 L650 120 L650 128 C600 188 540 188 480 128 C420 68 360 68 300 128 C240 188 180 188 120 128 L60 120 Z"/>
        <path class="splot__line" d="M60 120 C120 70 180 70 240 122 C300 174 360 174 420 122 C480 70 540 70 600 122 L650 122"/>
      </g>
      <g class="splot__s1">
        <path class="splot__line" d="M60 175 C140 165 220 180 300 170 C380 160 460 178 540 168 L650 172"/>
      </g>
      <g>
        <text class="splot__tick-label" x="52" y="44"  text-anchor="end">0.5</text>
        <text class="splot__tick-label" x="52" y="94"  text-anchor="end">0.0</text>
        <text class="splot__tick-label" x="52" y="144" text-anchor="end">−0.5</text>
        <text class="splot__tick-label" x="52" y="194" text-anchor="end">−1.0</text>
        <text class="splot__tick-label" x="60"  y="216" text-anchor="middle">0</text>
        <text class="splot__tick-label" x="240" y="216" text-anchor="middle">1</text>
        <text class="splot__tick-label" x="420" y="216" text-anchor="middle">2</text>
        <text class="splot__tick-label" x="600" y="216" text-anchor="middle">3</text>
      </g>
      <g class="splot__legend">
        <rect class="splot__legend-mark splot__s0" x="60" y="228" width="10" height="3"/>
        <text class="splot__anno" x="76" y="233">位移（含 90% 区间带）</text>
        <rect class="splot__legend-mark splot__s1" x="230" y="228" width="10" height="3"/>
        <text class="splot__anno" x="246" y="233">模型残差</text>
      </g>
    </svg>
    <p class="rep__cap">图 1 · 矢量绘制。网格线与区间带的填充深浅，是屏幕上唯一能看出"轻"的地方。</p>
  </figure>

  <div class="spark-row">
    <div class="spark-item"><b>样式表体积</b><em>148 KB</em>
      <span class="spark-wrap"><span class="sparkline" data-spark="96,112,118,126,133,141,148"></span></span></div>
    <div class="spark-item"><b>FCP 中位数</b><em>1,180 ms</em>
      <span class="spark-wrap"><span class="sparkline" data-spark="1602,1618,1609,1631,1625,1648,1180"></span></span></div>
    <div class="spark-item"><b>内存峰值</b><em>62 MB</em>
      <span class="spark-wrap"><span class="sparkline" data-spark="48,52,50,56,58,61,62"></span></span></div>
  </div>

  <div class="shots">
    <figure class="rep__fig">
      <img src="shot-heat-960.png" alt="损失热力图">
      <p class="rep__cap">图 2 · 热力图 960×600 ⇒ <b>321 dpi</b></p>
    </figure>
    <figure class="rep__fig">
      <img src="shot-ui-1920.png" alt="界面截图">
      <p class="rep__cap">图 3 · 截图 1920×1200 ⇒ <b>642 dpi</b></p>
    </figure>
  </div>

  <figure class="rep__fig rep__fig--table">
    <p class="rep__cap rep__cap--table" style="margin:0 0 1.5mm">表 1 · 同一份样式表在三种加载方式下的耗时（单位 ms，n=30，冷启动，每次清缓存）</p>
    <div class="table table--academic" tabindex="0" role="region" aria-label="加载耗时（可横向滚动）">
      <table aria-label="同一份样式表在三种加载方式下的耗时">
        <thead><tr><th scope="col">加载方式</th><th scope="col" class="num">FCP 中位数</th><th scope="col" class="num">p95</th><th scope="col">备注</th></tr></thead>
        <tbody>
          <tr><th scope="row">外链单文件</th><td class="num">1,180</td><td class="num">1,620</td><td>—</td></tr>
          <tr><th scope="row">外链 + preload</th><td class="num">1,090</td><td class="num">1,480</td><td>首字节提前</td></tr>
          <tr><th scope="row">内联关键 CSS</th><td class="num">860</td><td class="num">1,170</td><td>省一次往返</td></tr>
        </tbody>
      </table>
    </div>
  </figure>

</main>

<script src="../../../09-assets/sparkline/sparkline.js"></script>
</body>
</html>
