<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>打印样张 · 只用库类</title>
<!-- ============================================================================
     实体打印打样页（人手用，门禁不引用）。

     🔴 规矩只有一条：**夹具只写布局，样式一律来自库。**
        · 允许：display / flex / gap / max-width / margin:0
        · 禁止：任何十六进制色值、font-size、color、border、line-width、@media print 覆盖
        出现上面任何一条，就说明"库缺一条规则"——去补库，不要在这里补。

     代价（2026-11-06 实测）：前四版样张自己写了 `.shots img { width:100% }`
     和 print 令牌覆盖，于是图框、墨阶、图片宽度全验的是夹具，库的缺陷
     （.rep__fig 里 img 无约束）被盖了整整三轮打样。

     导出：node ../../ai/cli.js pdf sample.html --out sample.pdf
     ============================================================================ -->
<!-- 样式表顺序 = 库的层序：reset → 令牌 → 骨架 → 配方 → 资产 -->
<link rel="stylesheet" href="../../../01-tokens/base.reset.css">
<link rel="stylesheet" href="../../../01-tokens/tokens.css">
<link rel="stylesheet" href="../../../01-tokens/page.css">
<link rel="stylesheet" href="../../../04-recipes/report/report.css">
<link rel="stylesheet" href="../../../04-recipes/table/table.css">
<link rel="stylesheet" href="../../../09-assets/scientific-plot/scientific-plot.css">
<link rel="stylesheet" href="../../../09-assets/sparkline/sparkline.css">
<style>
  /* 🔴 夹具只允许写**布局**：并排、宽度、外边距归零。
     颜色、字号、线宽、线型、间距一律来自库 —— 这一页出现任何十六进制色值
     或 font-size，就说明是在验夹具，不是在验库。 */
  .row { display: flex; gap: var(--sp-5); align-items: flex-start; }
  .row > .rep__fig { flex: 1 1 0; min-width: 0; margin: 0; max-width: 80mm; }
  /* 80mm 是算出来的，不是挑的：960px 铺 80mm = 305dpi（连续调底线 300），
     1920px 铺 80mm = 610dpi（线条艺术底线 600）。再宽 2.5mm 就掉到线下。 */
</style>
</head>
<body class="page">
<article class="rep rep--technical">

  <header>
    <p class="rep__kicker">实体打样 · 只用库类</p>
    <h2 class="rep__title">满配样张：表格 · 矢量图 · 位图</h2>
    <p class="rep__standfirst">三线表、矢量折线、迷你趋势、两张位图 —— 四类“上纸会变样”的东西。位图分两类，纸面要求不同。</p>
  </header>

  <div class="rep__grid">
    <div class="rep__body">
      <section class="rep__sec">

        <figure class="rep__fig">
          <svg class="splot" viewBox="0 0 680 240" role="img" aria-label="阻尼振荡位移随时间变化，含 90% 区间带">
            <g class="splot__grid">
              <line x1="60" y1="40"  x2="650" y2="40"/>
              <line x1="60" y1="90"  x2="650" y2="90"/>
              <line x1="60" y1="140" x2="650" y2="140"/>
              <line x1="60" y1="190" x2="650" y2="190"/>
            </g>
            <line class="splot__axis" x1="60" y1="20" x2="60" y2="200"/>
            <line class="splot__axis" x1="60" y1="200" x2="650" y2="200"/>
            <g class="splot__s0">
              <path class="splot__band" d="M60 120 L60 120 C120 60 180 60 240 120 C300 180 360 180 420 120 C480 60 540 60 600 120 L650 120 L650 128 C600 188 540 188 480 128 C420 68 360 68 300 128 C240 188 180 188 120 128 L60 120 Z"/>
              <path class="splot__line" d="M60 120 C120 70 180 70 240 122 C300 174 360 174 420 122 C480 70 540 70 600 122 L650 122"/>
            </g>
            <g class="splot__s1">
              <path class="splot__line" d="M60 175 C140 165 220 180 300 170 C380 160 460 178 540 168 L650 172"/>
            </g>
            <g>
              <text class="splot__tick-label" x="52" y="44"  text-anchor="end">0.5</text>
              <text class="splot__tick-label" x="52" y="94"  text-anchor="end">0.0</text>
              <text class="splot__tick-label" x="52" y="144" text-anchor="end">−0.5</text>
              <text class="splot__tick-label" x="52" y="194" text-anchor="end">−1.0</text>
              <text class="splot__tick-label" x="60"  y="216" text-anchor="middle">0</text>
              <text class="splot__tick-label" x="240" y="216" text-anchor="middle">1</text>
              <text class="splot__tick-label" x="420" y="216" text-anchor="middle">2</text>
              <text class="splot__tick-label" x="600" y="216" text-anchor="middle">3</text>
            </g>
            <g class="splot__legend">
              <rect class="splot__legend-mark splot__s0" x="60" y="228" width="10" height="3"/>
              <text class="splot__anno" x="76" y="233">位移（含 90% 区间带）</text>
              <rect class="splot__legend-mark splot__s1" x="230" y="228" width="10" height="3"/>
              <text class="splot__anno" x="246" y="233">模型残差</text>
            </g>
          </svg>
          <figcaption class="rep__cap">矢量绘制。两条线在纸上同色，靠线型区分；区间带只留第一条。</figcaption>
        </figure>

        <div class="row">
          <div class="rep__fig">
            <p class="rep__note">样式表体积 · 148 KB</p>
            <span class="sparkline" data-spark="96,112,118,126,133,141,148" data-spark-height="22"></span>
          </div>
          <div class="rep__fig">
            <p class="rep__note">FCP 中位数 · 1,180 ms</p>
            <span class="sparkline" data-spark="1602,1618,1609,1631,1625,1648,1180" data-spark-height="22"></span>
          </div>
          <div class="rep__fig">
            <p class="rep__note">内存峰值 · 62 MB</p>
            <span class="sparkline" data-spark="48,52,50,56,58,61,62" data-spark-height="22"></span>
          </div>
        </div>

        <div class="row">
          <figure class="rep__fig">
            <img src="shot-heat-960.png" alt="热力图片段">
            <figcaption class="rep__cap">连续调位图：960 px 铺 80 mm，305 dpi。</figcaption>
          </figure>
          <figure class="rep__fig">
            <img src="shot-ui-1920.png" alt="界面截图片段">
            <figcaption class="rep__cap">线条艺术位图：1920 px 铺 80 mm，610 dpi。</figcaption>
          </figure>
        </div>

        <figure class="rep__fig rep__fig--table">
          <p class="rep__cap rep__cap--table">同一份样式表在三种加载方式下的耗时（n=30）</p>
          <div class="table table--academic" tabindex="0" role="region" aria-label="加载耗时（可横向滚动）">
            <table>
              <caption class="visually-hidden">同一份样式表在三种加载方式下的耗时</caption>
              <thead>
                <tr>
                  <th scope="col">加载方式</th>
                  <th scope="col" class="num">FCP 中位数</th>
                  <th scope="col" class="num">p95</th>
                  <th scope="col">备注</th>
                </tr>
              </thead>
              <tbody>
                <tr><th scope="row">外链单文件</th><td class="num">1,180</td><td class="num">1,620</td><td>—</td></tr>
                <tr><th scope="row">外链 + preload</th><td class="num">1,090</td><td class="num">1,480</td><td>首字节提前</td></tr>
                <tr><th scope="row">内联关键 CSS</th><td class="num">860</td><td class="num">1,170</td><td>省一次往返</td></tr>
              </tbody>
            </table>
          </div>
          <p class="rep__source">单位：ms。冷启动，每次清缓存。</p>
        </figure>

      </section>
    </div>
    <aside class="rep__aside">纸面上唯一还需要人眼确认的：图框是不是一条实线、位图里的字能不能读。</aside>
  </div>
</article>

<script src="../../../09-assets/sparkline/sparkline.js"></script>
</body>
</html>
