<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>嵌套浮层</title>
<style>
  @page { size: A4; margin: 12mm 10mm; }
  body { margin: 0; font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
          color: #15181c; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 0 0 6px; }

</style>
<link rel="stylesheet" href="../../../01-tokens/tokens.css">
<link rel="stylesheet" href="../../../03-patterns/overlay/overlay.css">
</head>
<body>
  <h1 id="page-title">正文标题：这张纸不能被浮层吃掉</h1>
  <p>屏幕上有两层叠着的对话框。打印时两层都要落回正常流，而且正文标题必须还在 —— 谁要是用 visibility:hidden 处理遮罩，正文就没了。</p>
  <div class="dialog-backdrop" id="bd-a">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="t-a">
      <h2 class="dialog__title" id="t-a">外层对话框 A</h2>
      <div class="dialog__body">外层的内容也要印在纸上。</div>
    </div>
  </div>
  <div class="dialog-backdrop" id="bd-b">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="t-b">
      <h2 class="dialog__title" id="t-b">内层对话框 B</h2>
      <div class="dialog__body">内层的内容同样不能丢。</div>
    </div>
  </div>
</body>
</html>
