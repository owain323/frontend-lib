<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>tree · 树形视图 · frontend-lib</title>
<link rel="stylesheet" href="../../01-tokens/tokens.css">
<link rel="stylesheet" href="../../01-tokens/typography.css">
<link rel="stylesheet" href="../../01-tokens/focus-ring.css">
<link rel="stylesheet" href="../../01-tokens/page.css">
<link rel="stylesheet" href="tree.css">
<style>
.kbd {
    display: inline-block; padding: 1px 6px; margin: 0 2px;
    background: var(--surface); border: 1px solid var(--border-decor);
    border-radius: var(--r-xs); font-family: var(--font-mono, monospace);
    font-size: .9em;
  }
.log {
    margin-top: var(--sp-4); padding: var(--sp-3);
    background: var(--surface-sunken); border-radius: var(--r-sm);
    font-family: var(--font-mono, monospace); font-size: var(--fs-xs);
    color: var(--text-secondary); min-height: 3em;
  }
.frame { padding: var(--sp-3); border: 1px solid var(--border-decor); border-radius: var(--r-md); }
</style>
</head>
<body class="page page">
<main class="wrap">

<h1>tree · 树形视图</h1>
<p class="note">
  依据 <strong>APG Tree View</strong>。两条最关键的设计：
  <br>① <strong>Roving tabindex</strong>：整棵树只占一个 Tab 位（当前节点 tabindex=0，其余 -1）
  <br>② <span class="kbd">←</span><span class="kbd">→</span>
  <strong>展开/收起并带着焦点走</strong>（已收起时按 ← 回到父节点）
  <br>其余：<span class="kbd">↑</span><span class="kbd">↓</span> 移动 ·
  <span class="kbd">Home</span><span class="kbd">End</span> 首末 ·
  <span class="kbd">*</span> 展开本层同级 · <span class="kbd">空格</span> 选中 ·
  <span class="kbd">a-z</span> 首字母跳转
</p>

<h2>1 · 文件树（试试键盘）</h2>
<div class="frame">
  <div id="t1"></div>
</div>
<div class="log" id="log">（焦点位置与选中项会显示在这里）</div>

<h2>2 · 默认全部收起</h2>
<div class="frame">
  <div id="t2"></div>
</div>

</main>

<script src="tree.js"></script>
<script>
(function () {
  var log = document.getElementById('log');
  function label(it) {
    var n = it.node;
    return (n.textContent || '').replace(/·/g, '').trim();
  }

  function mk(id, collapsed) {
    document.getElementById(id).innerHTML =
      '<ul role="group">' +
        '<li class="tree__item">' +
          '<div class="tree__node"><span class="tree__label">src</span>' +
            '<span class="tree__count">12</span></div>' +
          '<ul role="group">' +
            '<li class="tree__item">' +
              '<div class="tree__node"><span class="tree__label">components</span>' +
                '<span class="tree__count">6</span></div>' +
              '<ul role="group">' +
                '<li class="tree__item"><div class="tree__node">' +
                  '<span class="tree__label">Button.js</span></div></li>' +
                '<li class="tree__item"><div class="tree__node">' +
                  '<span class="tree__label">Card.js</span></div></li>' +
              '</ul>' +
            '</li>' +
            '<li class="tree__item">' +
              '<div class="tree__node"><span class="tree__label">styles</span>' +
                '<span class="tree__count">5</span></div>' +
              '<ul role="group">' +
                '<li class="tree__item"><div class="tree__node">' +
                  '<span class="tree__label">tokens.css</span></div></li>' +
                '<li class="tree__item"><div class="tree__node">' +
                  '<span class="tree__label">base.css</span></div></li>' +
              '</ul>' +
            '</li>' +
            '<li class="tree__item"><div class="tree__node">' +
              '<span class="tree__label">index.js</span></div></li>' +
          '</ul>' +
        '</li>' +
        '<li class="tree__item">' +
          '<div class="tree__node"><span class="tree__label">docs</span>' +
            '<span class="tree__count">3</span></div>' +
          '<ul role="group">' +
            '<li class="tree__item"><div class="tree__node">' +
              '<span class="tree__label">changelog.md</span></div></li>' +
          '</ul>' +
        '</li>' +
        '<li class="tree__item"><div class="tree__node">' +
          '<span class="tree__label">package.json</span></div></li>' +
      '</ul>';

    if (collapsed) {
      document.querySelectorAll('#' + id + ' [role="group"]').forEach(function (g) {
        if (g.parentElement.getAttribute && g.parentElement.getAttribute('role') === 'treeitem') {
          g.hidden = true;
          g.parentElement.setAttribute('aria-expanded', 'false');
        }
      });
    }

    return Tree.create(document.getElementById(id), {
      label: '文件树',
      onSelect: function (it) { log.textContent = '选中：' + label(it); },
      onActivate: function (it) { log.textContent = '激活：' + label(it); },
    });
  }

  var t1 = mk('t1', false);
  mk('t2', true);

  /* 焦点变化时也记一笔（演示 roving tabindex）*/
  document.addEventListener('focusin', function (e) {
    if (e.target.classList && e.target.classList.contains('tree__node')) {
      var t = e.target.closest('.tree__node').textContent.replace(/·/g, '').trim();
      log.textContent = '焦点：' + t;
    }
  });
})();
</script>
</body>
</html>
