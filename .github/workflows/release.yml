# ============================================================================
# release —— 打 tag 即发版（含 npm provenance 签名）
# ============================================================================
# 🔴🔴 不要 `git push --tags`
# ---------------------------------------------------------------------------
#   本工作流的触发条件是 `on.push.tags: v*` —— 也就是说**推几个 tag 就发几次版**，
#   而且它们会并发跑（`concurrency.group = release-${{ github.ref }}`，
#   每个 ref 一组，互不排队）。并发发版有两个直接后果：
#     · `latest` 最终指向哪个版本取决于谁最后完成 —— 不是版本号最大的那个
#     · 每个 tag 都会跑一遍发布前门禁，但它们的 `visual-stamp` 判的是**各自提交时**
#       的基线；历史 tag 的 Linux 基线多数已经过期 ⇒ 一片红，且红得没有意义
#
#   ⇒ 只推**要发布的那一个**：`git push origin v0.24.0`
#   ⇒ 本地留着但没发布过的里程碑 tag（v0.12.1 与 v0.17.0–v0.23.0，共 9 个），
#      **保留、不推、也不删** —— 它们是本地历史锚点，删了就找不回来。
#      推之前先 `git tag --list | sort -V` 核对；不要 `git push --tags`。
# ============================================================================
# 为什么需要这个工作流
# ---------------------------------------------------------------------------
#   发布此前是**手工**的：本地 `npm publish`，谁发、从哪个提交发、
#   发出去的包是不是 HEAD，全靠人记得。而发版恰恰是最不能靠记性的动作。
#
#   两件事只能在这里做：
#     ① **provenance**：`npm publish --provenance` 让 npm 用 OIDC 给包签名，
#        使用者可以查「这个 tarball 确实由这个仓库、这个提交、这条工作流构建」。
#        本地发不出这个签名 —— 本机不是受信任的构建环境。
#     ② 把 tag、版本号、CHANGELOG、Release 四者绑成一次原子动作。
#
# 凭据模型：trusted publishing（OIDC），**没有任何长期令牌**
# ---------------------------------------------------------------------------
#   前置条件（控制台层，只能人工做一次）：
#     npm 包设置 → Trusted Publisher → GitHub Actions
#       repository: 见 package.json 的 repository 字段
#       workflow:   release.yml
#       权限:       npm publish
#   npm 侧状态应为 `Valid`。本工作流不在任何地方读 secret ——
#   `id-token: write` 让 npm CLI 用 GitHub 的 OIDC 令牌现换一次短期凭证。
#
#   🔴 两条不能碰的约束（都实测踩过）：
#     ① **不要给 setup-node 传 `registry-url`**。它会写一行空的 `_authToken`
#        （值指向 `NODE_AUTH_TOKEN`），npm 先撞 ENEEDAUTH，根本轮不到 OIDC。
#     ② Node 22 自带的 npm 是 10.x，**不支持 trusted publishing**（要 >= 11.5.1）。
#        所以下面必须显式升级 npm，并把版本打进日志。
# ============================================================================

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      shoot_baseline:
        description: '只录本平台（Linux）的视觉基线，不发布'
        type: boolean
        default: false
      dist_tag_rm:
        description: '删除一个 dist-tag（填 tag 名，如 probe-2fa；空=不做）'
        type: string
        default: ''

permissions:
  contents: write     # 建 GitHub Release
  id-token: write     # ✅ provenance 必需：OIDC 令牌由这里签

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 校验 → 门禁 → 发布
    # 🔴 只有**打 tag** 才发布。workflow_dispatch 是给"补录某平台视觉基线"用的
    #   （见文件末尾的 shoot-baseline job）—— 手动点一下不该顺手把包发出去。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 🔴 25 分钟不够。实测 0.25.0：门禁 13.5 分 + 装 Chromium + dist 语义比对，
    #   到 `npm publish` 那一步只剩 100 秒 ⇒ 21:01:28 被 job 超时**掐断**，
    #   包已经传上去了（含 provenance），但后面的"建 Release"被跳过，
    #   于是 npm 有 0.25.0、GitHub 没有对应 Release —— 三者不齐。
    # ⚠️ 这个超时是**硬取消**，不是优雅退出：它会把流程停在任意一步，
    #   而 npm 的发布是**不可重来**的（同版本不能再发）。
    #   ⇒ 宁可放宽，也不要卡在最后一步。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 fetch-depth: 0 + fetch-tags 是**必须的**：
          #    release-gate 要核"版本有没有 tag 锚点"，而 depth=1 时
          #    抓下来的 tag 指向的是祖先提交，判据会凭空变红。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 🔴 故意不传 registry-url：见文件头 ①。传了会写空 _authToken。

      # 🔴 trusted publishing 要 npm >= 11.5.1，Node 22 自带 10.x。
      #   版本必须打进日志：失败时"到底是 CLI 太旧还是 OIDC 没配好"要能一眼分开。
      - name: 升级 npm（trusted publishing 需要 >= 11.5.1）
        run: |
          set -eu
          npm install -g npm@latest
          echo "npm=$(npm --version)  node=$(node --version)"

      # 🔴 必须在门禁**之前**装：视觉基线是在这套字体下录的。
      #   不装的话 CJK/阿拉伯文整段变方框，像素比对必然全红，
      #   而"红"的原因跟代码一点关系都没有（见 05-audit/ci-fonts.sh 顶部）。
      - name: 装 CI 字体（视觉基线锚在它上面）
        run: bash 05-audit/ci-fonts.sh

      # 🔴 checkout 处理 tag push 时会留下一个**指向提交的轻量 ref**，
      #   真正的 annotated tag 对象没被抓下来 ⇒ release 门禁的
      #   「tag 必须 annotated」会误判成"你打的是轻量 tag"（2026-10-29 实测）。
      #   `--force` 是必须的：本地那个轻量 ref 不是快进关系，不加它不覆盖。
      - name: 补齐 tag 对象
        run: git fetch --tags --force origin

      # 🔴 tag 触发时 `actions/checkout` 只抓这一个 tag，**不建**
      #   `refs/remotes/origin/*`。而 release-gate 的「tag 指向的提交必须被
      #   某个远端分支包含」没有那个视野就只能判红（它不许在看不到时放行）。
      #   ⇒ 发布前显式抓一次分支引用。仓库只有 2 MB，代价可以忽略。
      #   ⚠️ 这不是为了让判据变绿，是为了让它**看得见**：fetched 之后
      #      「给游离提交打 tag」依然会被挡住。
      - name: 补齐远端分支引用（tag 锚点判据需要）
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致 —— 拒绝发布（发出去的包会带着错的版本号）"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci

      # 🔴 先探测、再动手（2026-11 加）：
      #   原来是一条直线 ⇒ npm 成功、Release 失败后重跑必然撞 403，流程卡死。
      #   probe 只读，输出 `npm=… release=… provenance=…` 给下面两步当条件。
      #   ⚠️ npm 已存在时它还会核对 provenance 里的 gitCommit 是否等于本 tag：
      #      只看"版本存在"就跳过，等于把**任何**已存在的包当成我们发的那个。
      - name: 探测发布状态（只读）
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash 05-audit/release-run.sh probe >> "$GITHUB_OUTPUT"

      - name: 发布前门禁（与 prepublishOnly 同一套）
        run: npm run publish:check

      # 🔴 这两步**不**受"npm 已存在就跳过"影响（2026-11 加）：
      #   如果它们与 npm 发布共用同一个 if，恢复一次半完成的发布时
      #   会在**没跑 dist 校验**的情况下继续建 Release —— 那等于把发布验证
      #   变成了可跳过的装饰。所以：dist 校验无条件执行。
      - name: 安装 Chromium（dist 语义比对需要）
        run: npx playwright install --with-deps chromium

      - name: dist 语义比对（CSSOM / JS 行为）
        run: |
          # ⚠️ 必须套 with-server.sh：这两道是**浏览器**判据，要 :8000 上有
          #    这一棵树的静态服务。第一次发布时直接 `node …` 跑，
          #    CI 上 21 个组件全部 `ERR_CONNECTION_REFUSED` ——
          #    那不是"dist 与源码不等价"，是**观测条件没搭好**。
          bash 05-audit/with-server.sh bash -c '
            node 05-audit/dist-parity-check.js &&
            node 05-audit/dist-js-parity-gate.js
          '

      # 🔴 OIDC 全链路**没法在不发布的前提下真验证**（trusted publishing 的
      #   凭证交换只在 publish 那一刻发生，dry-run 不走那条路）。
      #   ⇒ 退一步：把「能提前查的三件事」查掉，让首次真实发版失败时
      #     报错指向原因，而不是一句难懂的 ENEEDAUTH。
      #   三件事：npm 够不够新 / 有没有残留 token / .npmrc 有没有 _authToken。
      - name: 发布前置断言（OIDC 路径必须干净）
        run: |
          set -eu
          V=$(npm --version)
          echo "npm=$V  node=$(node --version)"
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const need = [11, 5, 1];
            const ok = v[0] > need[0] ||
              (v[0] === need[0] && (v[1] > need[1] ||
              (v[1] === need[1] && v[2] >= need[2])));
            if (!ok) {
              console.error("::error::npm " + process.argv[1] +
                " 太旧：trusted publishing 需要 >= 11.5.1");
              process.exit(1);
            }
          ' "$V"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN 存在 —— 它会盖过 OIDC，先去掉再发"
            exit 1
          fi
          T=$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || true)
          case "$T" in
            ''|undefined|null) echo "OK 没有 _authToken 残留" ;;
            *) echo "::error::.npmrc 里有 _authToken（值不回显）—— OIDC 用不上"; exit 1 ;;
          esac

      - name: 发布到 npm（OIDC / provenance，无长期令牌）
        if: steps.probe.outputs.npm != 'present'
        run: npm publish --provenance --access public

      - name: 建 GitHub Release（正文取自 CHANGELOG 对应一节）
        if: steps.probe.outputs.release != 'present'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          # 从 `## [V]` 取到下一个 `## [` 之前
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG 里找不到 $V 这一节 —— Release 正文会是空的，拒绝创建"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "v$V" \
            --notes-file release-notes.md

      # 回执必须**永远**跑：失败时它就是"到底发到哪一步"的唯一记录。
      - name: 发布回执（npm + provenance + Release 三者齐备才算完成）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash 05-audit/release-run.sh verify

      # 🔴 门禁红了要能**看图**，不能只有一行"FAIL"。
      #   diff 图和当前截图都在这里，下载下来就能判断是"真回归"还是"环境变了"。
      - name: 失败时上传视觉证据（当前截图 + diff 图）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ github.run_id }}
          path: |
            10-review/shots/_current-*/
            10-review/shots/_diff-*/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # shoot-baseline —— 在**本平台**录一套视觉基线
  # ==========================================================================
  # 为什么单独一个 job：基线只能在它**将要被判的那个环境**里录。
  #   Linux 的基线没法在 Windows 上凭空生成（字体不同 ⇒ 渲染不同），
  #   而我又不打算把"CI 自己随便跑一次的截图"当成标准 —— 录完要**人看过**
  #   再提交，所以这里只出 artifact，不落库。
  #
  # 用法：Actions → release → Run workflow → 勾上 shoot_baseline
  #   产物：baseline-Linux（三个 `_baseline-linux*` 目录）
  #   下一步：下载解压到 `10-review/shots/`，**逐张看一遍**，再提交。
  shoot-baseline:
    name: 录本平台视觉基线（不发布）
    if: github.event_name == 'workflow_dispatch' && inputs.shoot_baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 装 CI 字体（与判基线时同一套）
        run: bash 05-audit/ci-fonts.sh
      - run: npm ci
      - name: 录三套基线（一次加载拍三套）
        run: |
          set -eu
          python3 05-audit/shot-baseline.py --record
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ runner.os }}
          # 🔴 只传**本平台**那三套。
          #   写成 `_baseline-*/` 时实测把仓库里已有的 win32 三套也打进了产物
          #   （2026-11-04 run 41845757012：224 个条目里有 6 个目录、218 张 png，
          #    其中 109 张是 win32）。下载的人若整目录覆盖，就会用
          #   "这次 checkout 里的其他平台基线"盖掉本地刚录好的那套 ——
          #   而它们看起来一样，坏起来无声。
          #   本 job 只在 ubuntu 上跑（`runs-on: ubuntu-latest`），范围写死 linux 即可。
          path: 10-review/shots/_baseline-linux*/
          retention-days: 14

  # ==========================================================================
  # dist-tag-cleanup —— 删除一个 dist-tag（一次性运维）
  # ==========================================================================
  # 为什么需要它：npm 2026-07 起的策略把"包管理类删除"从
  # **勾了「绕过两步验证」的细粒度令牌**手里拿走了（403，见 docs/RELEASE-PROCESS.md §5.1.1），
  # 而 npm 的网页里根本没有 dist-tag 管理入口（/package/<pkg>/dist-tags 是 404，
  # Versions 页的 Current Tags 只有只读表格）。
  #
  # 剩下唯一不需要账号密码/一次性口令的合法通道就是 **trusted publishing**：
  #   · npm 包设置 → Trusted Publisher → GitHub Actions，
  #     workflow 填 `release.yml`，勾上 "Allow npm dist-tag"
  #   · 本 job 用 OIDC 换凭证（`id-token: write`），不碰任何长期令牌
  #
  # 🔴 只在 `workflow_dispatch` 且填了 tag 名时才跑：打 tag 发版**不会**走到这里。
  # 🔴 不要给 setup-node 传 registry-url —— 那会写一条空的 `_authToken` 行
  #    （值指向 `NODE_AUTH_TOKEN`），npm 会先撞 ENEEDAUTH，根本轮不到 OIDC。
  dist-tag-cleanup:
    name: 删除 dist-tag（trusted publishing，不发布）
    if: github.event_name == 'workflow_dispatch' && inputs.dist_tag_rm != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write     # OIDC 必需
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 升级 npm（trusted publishing 需要 >= 11.5.1）
        run: |
          set -eu
          npm install -g npm@latest
          npm --version
      - name: 删除 dist-tag
        env:
          TAG_TO_REMOVE: ${{ inputs.dist_tag_rm }}
        run: |
          set -eu
          echo "删除 agentcss 上的 dist-tag：$TAG_TO_REMOVE"
          npm dist-tag rm agentcss "$TAG_TO_REMOVE" --registry=https://registry.npmjs.org/
      - name: 复查（打印剩余 tags）
        run: npm dist-tag ls agentcss --registry=https://registry.npmjs.org/
