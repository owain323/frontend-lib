# ============================================================================
# frontend-lib CI
#
# ============================================================================
# 三层设计（为什么要分层）
# ---------------------------------------------------------------------------
#   pr         —— 每个 PR 都跑，必须快、必须跨平台可靠
#   contract   —— 契约类门禁（类型/ API 形态 / 文档事实）
#   nightly    —— 浏览器矩阵（含 WebKit），慢、可能因平台差异误报
#
# 🔴🔴 为什么不全量门禁都塞进 PR
# ---------------------------------------------------------------------------
#   实测在 Linux runner 上跑全量会 FAIL 10+ 道（本地 Windows 全绿）：
#     · 字体渲染不同 → 视觉 diff 必然不一致
#     · 路径/编码处理不同 → 体积类门禁误报
#     · shallow clone → 依赖 git 状态的判据语义不同
#     · 浏览器版本不同 → 截图基线不匹配
#
#   ⚠️ **一个长期红的 CI 比没有 CI 更糟** ——
#      大家会习惯性忽略它，真正的新问题也一起被忽略。
#   ⇒ PR 只跑「实测跨平台可靠」的那部分；其余交给 nightly。
#   ⚠️ 上面的清单**不是猜的**：每道都标注了它是否已在 PR 跑过并验证。
#      新增门禁若不确定跨平台安全，先放 nightly。
# ============================================================================
#
# 🔴🔴 npm ci 是必须的
# ---------------------------------------------------------------------------
#   只跑 `node --test` 而不装依赖时，「锁文件可复现」这个承诺
#   **从未被验证过** —— 它只证明了 package-lock.json 存在。
#   而 reproducible development environment 是写进卖点的一条。
#   ⇒ 每个 job 都必须先 npm ci。
# ============================================================================

name: gate

on:
  pull_request:
    branches: [master]
  # 🔴 2026-11-05 加：master 直推也要跑「快门禁」。
  #   加之前只有 PR / nightly / 手动 —— 而这个仓库一直是**直推 master**，
  #   等于日常提交**完全没有 CI 保护**，全靠本地记得跑。
  #   实测代价：公开仓库 Actions 不计费；quick 在 Linux 上约 3–4 分钟。
  #   ⚠️ 只跑 quick：contract 与三引擎矩阵留给 PR / nightly，
  #      否则每次 push 白烧 20 分钟，人就会开始忽略红灯。
  push:
    branches: [master]
  schedule:
    # nightly：每天 UTC 03:17（错开整点，避开所有机器的高峰）
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================================
  # ① PR 快门禁 —— 纯静态，零浏览器，秒级
  # ==================================================================
  quick:
    name: 快门禁（静态 + 视觉，Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 兜底：卡住就掐掉，不烧额度（视觉那三套跑完约 40s）
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 fetch-depth: 0 + fetch-tags —— release 门禁要核 "版本有没有 tag 锚点"。
          #    默认 depth=1 时 tag 指向的是祖先提交，**根本不会被抓下来**，
          #    于是 CI 从 2026-10-19 起一直是红的（本地全绿，没人看出为什么）。
          #    仓库只有 2 MB，全量检出比一次误诊便宜得多。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🔴 视觉基线**锚在字体上**，而 ubuntu 默认没有 CJK/阿拉伯/希伯来字体。
      #   不装 ⇒ 文字整段变方框 ⇒ 像素比对全红，且红的原因与代码无关。
      #   ⚠️ 这个 job 原本叫"静态，跨平台"——那是个**假声明**：
      #      视觉门禁在 MODE=fast 里跑，而它既不是纯静态、也不跨平台
      #      （基线按平台分集，见 05-audit/shot-baseline.py 顶部）。
      #      2026-10-29 门禁第一次在 CI 上跑，42 张基线全红就是这么发现的。
      - name: 装 CI 字体（视觉基线锚在它上面）
        run: bash 05-audit/ci-fonts.sh

      # 🔴 与 release 工作流同因：checkout 对 tag 只留轻量 ref，
      #   annotated tag 对象抓不下来 ⇒ release 门禁会误判。
      - name: 补齐 tag 对象
        run: git fetch --tags --force origin

      # 🔴 release 门禁的「tag 指向的提交必须被某个远端分支包含」需要
      #   `refs/remotes/origin/*`。而 `actions/checkout` 对 `pull_request`
      #   只抓 merge ref、对 tag 只抓该 tag —— **两者都不会建远端分支引用**。
      #   不补这一行，判据会在 CI 上报「看不到任何 refs/remotes/origin/*」，
      #   而那正是它设计上**不许判通过**的情形（视野为空 ≠ 没问题）。
      - name: 补齐远端分支引用（tag 锚点判据需要）
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      # 🔴 必须装依赖：否则 lockfile 的可复现性从未被验证
      - name: 按锁文件安装（验证 lockfile 真能装）
        run: npm ci

      - name: 依赖审计（运行时 0 漏洞；开发链不允许 high 及以上）
        # 外部审计 F3：仓库曾经带着 9 个 high + 1 个 moderate，全部在 devDependencies
        # 链上（puppeteer-core@23 → @puppeteer/browsers → extract-zip / proxy-agent，
        # 以及 chromium-bidi → zod）。生产用户不受影响，但 CI 与开发机受影响。
        #
        # 为什么要在这里加而不是放进 check-all：
        #   npm audit 要联网，离线跑门禁时会假红；CI 一定联网，放这里最合适。
        # 分两段判，语义不同：
        #   ① 运行时依赖必须**零漏洞**（这一条是给使用者的承诺，任何级别都不接受）
        #   ② 开发链只拦 high/critical —— moderate 可能是无法修的传递依赖，
        #      把它也判红会逼着人加忽略名单，反而失去意义。
        run: |
          echo '--- 运行时依赖（--omit=dev）---'
          npm audit --omit=dev --audit-level=low
          echo '--- 含开发链（只拦 high 及以上）---'
          npm audit --audit-level=high

      - name: 单元测试
        run: npm test

      - name: 类型契约（正例必过 + 反例必挂）
        run: python3 05-audit/tsc-gate.py

      # 🔴 私有词表**不进仓库**（它本身就含真实代号），所以 CI 上默认缺席。
      #   缺席时 leak-scan 会打印「⚠️ 私有词表未加载（0 条）⇒ 本次未覆盖」，
      #   而 check-all 照样可能全绿 —— 那就是**判据变弱但没人知道**。
      #   ⇒ 两条：① 有 secret 就用；② 没有就显式打一条 notice，别假装覆盖了。
      - name: 载入私有词表（可选，缺失时明示未覆盖）
        env:
          FL_TERMS: ${{ secrets.FL_PRIVATE_TERMS }}
        run: |
          set -eu
          if [ -n "${FL_TERMS:-}" ]; then
            mkdir -p internal
            printf '%s\n' "$FL_TERMS" > internal/private-terms.txt
            n=$(grep -vcE '^[[:space:]]*(#|$)' internal/private-terms.txt || true)
            echo "私有词表已载入：${n} 条（内容不回显）"
          else
            echo "::notice title=leak 判据不完整::仓库 secret FL_PRIVATE_TERMS 未配置 —— 真实代号/用户名那一类在 CI 上不覆盖（本地跑仍覆盖）。配置方式见 CONTRIBUTING「私有词表」一节。"
          fi

      - name: 静态门禁
        # 🔴🔴 0.8.9 改：不再手挑门禁清单，改为调用 `MODE=fast bash 05-audit/check-all.sh`。
        #
        #   为什么必须改（这是 P0-1 的**同源病根**，只是长在 CI 上）：
        #     原来这里手挑了 10 道门禁，而 check-all.sh 里注册了 **135 道**。
        #     ⇒ 上面每一轮修的门禁 —— 包括 P0-1 修好的七道假绿门禁
        #       （hardcode / icon / measure / license / numeric / tierA / reuse-check）
        #       与新增的 rewrite-residue-gate —— **在 CI 上一次都没跑过**。
        #     ⇒ 「本地全绿、CI 也全绿」这个判断在 125 道上从来没成立过。
        #
        #   为什么手挑必然漏：清单是**另一份**「哪些门禁重要」的表述，
        #     而门禁清单本身就在 check-all.sh 里 —— 两份清单必然漂移。
        #     这与 05-audit 的重复判定（E31）是同一个病：
        #     **同一个决定写两遍 ⇒ 迟早打架。**
        #
        #   MODE=fast 会跳过浏览器类门禁（需 Chromium），那是 `browsers` job 的事；
        #   静态部分与本地跑的**完全同一份代码**，不再有「CI 少跑了哪些」这个问题。
        run: MODE=fast bash 05-audit/check-all.sh

      # ⚠️ 上面那个 run 的环境是 ubuntu，check-all.sh 里的 python3 就是系统 python3。
      #   Windows 上 `PY` 指向托管 python —— 两边脚本同源，只是解释器不同。
      - name: 版本四处一致（手改版本号是最常见的自相矛盾来源）
        run: python3 05-audit/bump-version.py --check

      - name: 打包实装冒烟（npm pack → 装进空项目 → 核对）
        run: bash 05-audit/pack-smoke.sh

      # 🔴 视觉门禁红了必须能**看图**：diff 图和当前截图都在这里。
      #   没有它，CI 上的 "FAIL 03-patterns_tree.png 7.6%" 只能靠猜
      #   （本机看不到那台机器的渲染结果）。
      - name: 失败时上传视觉证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ github.run_id }}
          path: |
            10-review/shots/_current-*/
            10-review/shots/_diff-*/
          retention-days: 7
          if-no-files-found: ignore

  # ==================================================================
  # ② API 契约 —— 需要浏览器，但只要本地静态服务
  # ==================================================================
  contract:
    name: API 契约（运行时 ↔ 类型 ↔ 文档）
    # push 只跑 quick：契约要装 Chromium，12 分钟，留给 PR / nightly。
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 fetch-depth: 0 + fetch-tags —— release 门禁要核 "版本有没有 tag 锚点"。
          #    默认 depth=1 时 tag 指向的是祖先提交，**根本不会被抓下来**，
          #    于是 CI 从 2026-10-19 起一直是红的（本地全绿，没人看出为什么）。
          #    仓库只有 2 MB，全量检出比一次误诊便宜得多。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 按锁文件安装
        run: npm ci

      # 契约类门禁需要真实浏览器里创建实例
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行时 API 形状 ↔ 类型声明
        run: python3 05-audit/api-contract-gate.py

      - name: API.md 接入形态 ↔ 实现
        run: python3 05-audit/api-form-gate.py

      - name: API 文档一致性
        run: python3 05-audit/api-doc-gate.py

  # ==================================================================
  # ③ nightly 浏览器矩阵 —— 含 WebKit
  # ==================================================================
  #⭐ 为什么 WebKit 比 Firefox 重要
  #    本库定位是**移动 WebView**，iOS 上就是 WebKit。
  #    而此前矩阵里是Chromium + Firefox（两个桌面浏览器），
  #    唯独漏了真正的目标平台 —— **优先级排错了**。
  browsers:
    name: 浏览器矩阵（${{ matrix.name }}）
    # PR 不跑（省额度）；push 也不跑（只留 quick）；nightly / 手动跑全矩阵。
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # 一个引擎挂不影响其它引擎的报告
      matrix:
        include:
          - name: chromium
            engine: chromium
          - name: webkit
            engine: webkit
          - name: firefox
            engine: firefox
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 fetch-depth: 0 + fetch-tags —— release 门禁要核 "版本有没有 tag 锚点"。
          #    默认 depth=1 时 tag 指向的是祖先提交，**根本不会被抓下来**，
          #    于是 CI 从 2026-10-19 起一直是红的（本地全绿，没人看出为什么）。
          #    仓库只有 2 MB，全量检出比一次误诊便宜得多。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 按锁文件安装
        run: npm ci

      - name: 安装 ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      # 🔴 引擎自证（评审给的验收标准，2026-10-09 加）
      #    光有 matrix.engine 不够 —— 它以前只用在 install 这一步，
      #    测试启动器根本没收到 ⇒ 三个作业跑的都是 Chromium。
      #    ⇒ 必须由作业自己站出来报一次 UA，并校验它与声明的引擎一致。
      #      （Chromium 的 UA 里也含 "AppleWebKit"，所以不能只判这个子串）
      - name: 引擎自证（${{ matrix.engine }}）
        run: node 05-audit/engine-probe.js
        env:
          FL_ENGINE: ${{ matrix.engine }}

      # 视觉基线是本机生成的，跨平台必然不一致 ⇒ nightly 只跑不依赖截图的
      - name: 契约测试（${{ matrix.engine }}）
        env:
          # ⭐ 这一行就是"矩阵真的分引擎"的开关：没有它，三个作业跑同一个浏览器
          FL_ENGINE: ${{ matrix.engine }}
        run: |
          set -e
          python3 -m http.server 8000 &
          SRV=$!
          sleep 2
          trap "kill $SRV" EXIT
          for c in select combobox date-range overlay accordion tabs \
                   tree dropdown popover tooltip; do
            if [ -f "05-audit/${c}-check.js" ]; then
              echo "--- ${c}"
              node "05-audit/${c}-check.js"
            fi
          done

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.engine }}
          path: 10-review/shots/
          retention-days: 7
