<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接入样板：项目自带令牌 + 本库组件</title>
<!-- 🔴 关键：令牌由"项目"提供，本库只提供组件。
     这是 examples/react-vite/README.md 里说的「方式 ①：只取组件不取令牌」，
     也是 演示项目名 真实需要的接法（它有自己的 40 个令牌）。
     本页顶部的 :root 就是"项目令牌"，刻意用**固定 px**，
     与本库的 clamp() 流体令牌形成对照。 -->
<style>
  :root {
    --paper: #f5f5f4;  --surface: #ffffff;  --surface-sunken: #ecebe9;
    --text-primary: #1c1b1a;  --text-secondary: #55534e;  --text-tertiary: #66625c;
    --accent: #185fa5;  --accent-hover: #10406f;  --accent-soft: #e6f1fb;
    --text-on-accent: #ffffff;
    --border-control: #d4d2ce;  --border-decor: #e4e2df;  --border-decor-str: #c9c6c1;
    --success: #1a7f37;  --danger: #a32d2d;  --warning: #9a6700;  --info: #185fa5;
    --success-bg: #e8f5ec;  --danger-bg: #fbeceb;  --warning-bg: #fdf3e2;  --info-bg: #e6f1fb;
    --scrim: rgba(28,27,26,.45);
    --r-sm: 4px;  --r-md: 6px;  --r-lg: 10px;  --r-pill: 999px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
    --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 20px; --fs-2xl: 24px;
    --lh-tight: 1.25; --lh-base: 1.5; --lh-loose: 1.7;
    --shadow-1: 0 1px 2px rgba(28,27,26,.06);
    --shadow-2: 0 8px 24px rgba(28,27,26,.12);
    --dur-fast: 120ms; --dur-base: 200ms; --ease-out: cubic-bezier(.2,.7,.3,1);
    --z-overlay: 100; --z-toast: 200;
  }
</style>
<!-- 只引组件，不引本库令牌 —— 证明组件能在别人的令牌体系下工作 -->
<link rel="stylesheet" href="../../01-tokens/typography.css">
<link rel="stylesheet" href="../../02-primitives/button/button.css">
<link rel="stylesheet" href="../../02-primitives/input/input.css">
<link rel="stylesheet" href="../../02-primitives/card/card.css">
<style>
  /* 项目自己的布局 —— 证明本库 CSS 类能与项目样式共存 */
  body { margin:0; padding: var(--sp-6); background: var(--paper); color: var(--text-primary);
         font: var(--fs-base)/var(--lh-base) var(--sans); }
  .app { max-width: 640px; margin: 0 auto; }
  .row { display: flex; gap: var(--sp-3); align-items: flex-end; margin-top: var(--sp-4); }
  .row .field { flex: 1; }
</style>
</head>
<body>
<div class="app">
  <h1 style="font-size:var(--fs-2xl); line-height:var(--lh-tight); margin:0 0 var(--sp-2)">
    接入样板</h1>
  <p style="color:var(--text-secondary); margin:0 0 var(--sp-5)">
    上面是<strong>项目自己的令牌</strong>（固定 px，暖灰，40 个里的 30 个），
    下面是<strong>本库的组件</strong>。两者共存，零构建。</p>

  <div class="card">
    <div class="card__body">
      <h2 class="card__title" style="font-size:var(--fs-lg)">保存设置</h2>

      <div class="field">
        <label class="field__label" for="ticker">代码</label>
        <input class="field__input" id="ticker" value="600519">
        <span class="field__hint">如 600519</span>
      </div>

      <div class="row">
        <div class="field">
          <label class="field__label" for="note">备注</label>
          <input class="field__input" id="note" placeholder="可选">
        </div>
        <button class="btn btn--primary" id="save">保存</button>
        <button class="btn btn--secondary" id="cancel">取消</button>
      </div>

      <p role="status" aria-live="polite" id="status"
         style="margin:var(--sp-4) 0 0; min-height:1.5em; color:var(--text-secondary)"></p>
    </div>
  </div>

  <div style="margin-top:var(--sp-6); display:flex; gap:var(--sp-3); flex-wrap:wrap">
    <button class="btn btn--md">默认</button>
    <button class="btn btn--md btn--secondary">次要</button>
    <button class="btn btn--md btn--ghost">幽灵</button>
    <button class="btn btn--md btn--primary" disabled>禁用</button>
  </div>
</div>
<script>
  // 焦点管理：与本库 focus-visible 配合（不覆盖 outline）
  document.getElementById('save').addEventListener('click', function () {
    var b = this, s = document.getElementById('status');
    b.classList.add('is-success'); b.setAttribute('aria-busy', 'true');
    s.textContent = '保存中…';
    setTimeout(function () {
      b.classList.remove('is-success'); b.removeAttribute('aria-busy');
      s.textContent = '已保存';
    }, 900);
  });
  document.getElementById('cancel').addEventListener('click', function () {
    document.getElementById('status').textContent = '已取消';
  });
</script>
</body>
</html>
